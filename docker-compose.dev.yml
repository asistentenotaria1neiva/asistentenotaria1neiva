# Entorno de DESARROLLO: base de datos y conversor PDF, publicados solo en 127.0.0.1.
# Uso: docker compose -f docker-compose.dev.yml up -d
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: escrituracion
      POSTGRES_USER: escrituracion
      POSTGRES_PASSWORD: desarrollo_local_solamente
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdatos_dev:/var/lib/postgresql/data

  gotenberg:
    image: gotenberg/gotenberg:8
    ports:
      - "127.0.0.1:3001:3000"

volumes:
  pgdatos_dev:
