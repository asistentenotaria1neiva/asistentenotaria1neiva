# Despliegue de PRODUCCIÓN.
# - Solo el proxy (Caddy) expone puertos (80/443) y termina TLS con certificado automático.
# - La base de datos y el conversor PDF están en una red interna sin salida a internet.
# - Los secretos se leen del archivo .env del servidor (nunca del repositorio).
services:
  proxy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO}
    volumes:
      - ./despliegue/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_datos:/data
    networks: [publica, interna]
    depends_on: [app]

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PDF_CONVERSOR_URL: http://gotenberg:3000
    volumes:
      - almacenamiento:/app/almacenamiento # documentos cifrados (AES-256-GCM)
    networks: [interna, salida]
    depends_on: [db, gotenberg]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdatos:/var/lib/postgresql/data # volumen sobre disco cifrado del proveedor
    networks: [interna] # sin puertos publicados: no es accesible desde internet

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    command: ["gotenberg", "--chromium-disable-routes=true", "--api-disable-health-check-logging=true"]
    networks: [interna]

networks:
  publica: {}
  salida: {} # salida a internet solo para la app (API de Claude)
  interna:
    internal: true

volumes:
  pgdatos:
  almacenamiento:
  caddy_datos:
